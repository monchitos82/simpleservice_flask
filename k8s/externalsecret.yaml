apiVersion: external-secrets.io/v1  # Changed from v1beta1
kind: ExternalSecret
metadata:
  name: simpleservice-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: simpleservice-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASS
      remoteRef:
        key: simpleservice
        property: database_pass