apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simpleservice-tls
  namespace: apps
spec:
  secretName: simpleservice-tls
  duration: 2160h
  renewBefore: 360h
  subject:
    organizations:
      - Local Development
  commonName: simpleservice.local
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - simpleservice.local
    - simpleservice.apps.svc.cluster.local
    - localhost
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io